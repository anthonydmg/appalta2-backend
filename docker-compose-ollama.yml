services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-local
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    environment:
      OLLAMA_KEEP_ALIVE: 20m
      OLLAMA_CONTEXT_LENGTH: 8192

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
    name: ollama_local_data