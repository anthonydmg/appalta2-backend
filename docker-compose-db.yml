services:
  postgis:
    image: postgis/postgis:17-3.7
    container_name: appalta-postgis
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data: